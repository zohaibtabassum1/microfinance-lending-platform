<!DOCTYPE html>
<html>
<head>
    <title>Loan Application</title>
</head>
<body>

    <h1>Loan Application Form</h1>

   <form method="POST" action="/loan">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Full Name:</label>
    <input type="text" name="full_name" placeholder="Enter your full name" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <br><br>

    <label>Loan Amount (PKR):</label>
    <input type="number" name="loan_amount" placeholder="Enter loan amount" required>

    <br><br>

    <label>Loan Purpose:</label>
    <textarea name="loan_purpose" placeholder="Why do you need this loan?" required></textarea>

    <br><br>

    <button type="submit">Submit Application</button>

</form>

</body>
</html>
