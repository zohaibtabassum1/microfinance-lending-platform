<!DOCTYPE html>
<html>
<head>
    <title>Borrower Profile</title>
</head>
<body>

    <h1>Borrower Profiles</h1>

    {% for borrower in borrowers %}

        <div>
            <h2>{{ borrower.name }}</h2>

            <p>Email: {{ borrower.email }}</p>
            <p>City: {{ borrower.city }}</p>
            <p>Loan Amount: Rs. {{ borrower.loan_amount }}</p>
            <p>Loan Status: {{ borrower.loan_status }}</p>
        </div>

        <hr>

    {% endfor %}

</body>
</html>
